<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recherche UX & Wireframes : Livraison Campus CMC Rabat</title>
<style>
  :root {
    --bg-main: #2d5a3c;
    --bg-accent: #4c8c58;
    --crust: #3b2416;
    --bread: #d9822b;
    --fruit: #d94e4e;
    --citrus: #f2b705;
    --cream: #fffcf7;
    --ink: #2a1f18;
    --muted: #6e5d52;
    --light: #f6efe6;
    --pale: #e6dacb;
    --green: #3f9a57;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at 20% 20%, #3d754e 0%, var(--bg-main) 65%, #1e3f29 100%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    user-select: none;
    position: relative;
  }

  /* Rideau de théâtre (intro) */
  .curtain { position: fixed; inset: 0; z-index: 100; display: flex; pointer-events: none; }
  .curtain.done { display: none; }
  .curtain-half {
    position: relative; flex: 1; height: 100%;
    background-image: url('rideau.jpg'), linear-gradient(90deg, #3a0008 0%, #8a0f1c 30%, #b3121f 50%, #8a0f1c 70%, #3a0008 100%);
    background-size: cover, cover;
    background-position: center, center;
    transition: transform 1.8s cubic-bezier(.65, 0, .35, 1);
    box-shadow: inset 0 0 120px rgba(0, 0, 0, .55);
  }
  .curtain.open .curtain-left { transform: translateX(-101%); }
  .curtain.open .curtain-right { transform: translateX(101%); }

  /* Barre haute */
  .topbar {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 40px; color: var(--cream); font-weight: 600; font-size: 14px;
  }
  .counter { font-variant-numeric: tabular-nums; opacity: .9; }
  .fs-btn {
    background: rgba(255, 252, 247, .16); border: 1px solid rgba(255, 252, 247, .35);
    color: var(--cream); padding: 7px 15px; border-radius: 999px; cursor: pointer; font-size: 13px; font-family: inherit;
  }
  .fs-btn:hover { background: rgba(255, 252, 247, .26); }

  /* Scène */
  .stage {
    position: relative; z-index: 2;
    flex: 1; display: grid; grid-template-columns: 30% 1fr; gap: 28px;
    padding: 0 40px; min-height: 0;
  }
  .stack-wrap { position: relative; perspective: 1400px; display: flex; align-items: center; justify-content: center; }
  .stack { position: relative; width: 100%; max-width: 380px; height: 420px; transform-style: preserve-3d; }
  .stack-card {
    position: absolute; left: 0; top: 50%; width: 100%; height: 300px; margin-top: -150px;
    background: var(--cream); border-radius: 24px; padding: 24px;
    box-shadow: 0 22px 44px rgba(18, 32, 20, .35);
    border-top: 6px solid var(--bread);
    display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    cursor: pointer;
    transition: transform .9s cubic-bezier(.2, .8, .2, 1), opacity .9s ease;
  }
  .sc-top { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }
  .sc-top b { color: var(--bread); font-size: 13px; font-weight: 800; }
  .sc-title { font-size: 19px; font-weight: 800; color: var(--crust); line-height: 1.2; }

  .main-wrap { position: relative; display: flex; align-items: center; min-height: 0; }
  .main-card {
    position: relative; width: 100%; height: min(78vh, 680px);
    background: var(--cream); border-radius: 30px; padding: 32px 40px;
    box-shadow: 0 30px 60px rgba(15, 28, 18, .38);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .main-card.enter { animation: enter .7s cubic-bezier(.2, .8, .2, 1); }
  @keyframes enter {
    from { opacity: 0; transform: translateX(40px) scale(.98); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  .main-card.cover {
    background: linear-gradient(135deg, var(--crust) 0%, #52321e 100%);
    color: var(--cream); justify-content: center;
  }

  .content { flex: 1; min-height: 0; overflow: auto; padding-right: 6px; }
  .section-tag { font-size: 12px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; color: var(--bread); }
  .slide-title { font-size: 28px; font-weight: 800; color: var(--crust); margin: 6px 0 16px; line-height: 1.2; }
  .cover .slide-title { font-size: 44px; color: var(--cream); margin: 0 0 18px; }
  .lead { font-size: 16px; line-height: 1.55; color: var(--ink); margin-bottom: 14px; }
  .cover .lead { color: var(--pale); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 16px; }
  .cover .hint { color: var(--pale); opacity: .85; }
  .note { font-size: 12px; color: var(--muted); margin-top: 14px; font-style: italic; }

  /* Écran de vidéo */
  .screen-frame {
    position: relative; width: 100%; max-width: 560px; aspect-ratio: 16 / 9;
    border-radius: 18px; background: #0d0907; padding: 10px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45), inset 0 0 0 2px #2a1d14;
    margin-bottom: 22px;
  }
  .screen-inner {
    position: relative; width: 100%; height: 100%; border-radius: 10px; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #5a1a22 0%, #2a0c10 70%, #120506 100%);
    animation: screenGlow 4s ease-in-out infinite;
  }
  .screen-inner::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 220, 200, .18) 50%, transparent 65%);
    transform: translateX(-100%);
    animation: sweep 5s ease-in-out infinite;
  }
  .screen-inner::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 2px, transparent 2px 4px);
  }
  .play {
    position: absolute; left: 50%; top: 50%; transform: translate(-42%, -50%);
    width: 0; height: 0; border-left: 30px solid var(--cream);
    border-top: 18px solid transparent; border-bottom: 18px solid transparent;
    opacity: .92; animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes screenGlow { 0%, 100% { filter: brightness(.92); } 50% { filter: brightness(1.12); } }
  @keyframes sweep { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }
  @keyframes pulse {
    0%, 100% { transform: translate(-42%, -50%) scale(1); }
    50%      { transform: translate(-42%, -50%) scale(1.08); }
  }

  /* Bandeau image snacks */
  .banner {
    height: 160px; border-radius: 20px; margin-bottom: 18px;
    background-image: url('snack.jpg'), linear-gradient(135deg, var(--bread) 0%, var(--bg-accent) 100%);
    background-size: cover, cover; background-position: center, center;
    box-shadow: 0 10px 22px rgba(59, 36, 22, .25);
  }

  /* Informations projet */
  .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 8px; }
  .info-grid div { background: var(--light); border-left: 4px solid var(--bread); border-radius: 12px; padding: 12px 16px; }
  .info-grid dt { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  .info-grid dd { font-size: 16px; font-weight: 700; color: var(--crust); margin-top: 4px; }

  /* Sommaire cliquable */
  .toc { list-style: none; display: grid; gap: 8px; }
  .toc-item {
    width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    background: var(--light); border: 1px solid var(--pale); border-radius: 14px; padding: 9px 16px;
    font-family: inherit; font-size: 15px; font-weight: 700; color: var(--crust); cursor: pointer;
    transition: background .25s ease, transform .25s ease;
  }
  .toc-item:hover { background: #fbe9cf; transform: translateX(4px); }
  .toc-item span {
    min-width: 32px; height: 32px; border-radius: 50%; background: var(--bread); color: var(--cream);
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800;
  }

  /* Blocs */
  .box { background: var(--light); border-radius: 16px; padding: 16px 20px; margin-bottom: 14px; line-height: 1.55; }
  .box h4 { font-size: 16px; color: var(--crust); margin-bottom: 8px; }
  .box p { font-size: 15px; margin-bottom: 6px; }
  .box p:last-child { margin-bottom: 0; }
  .content p { font-size: 15px; line-height: 1.6; margin-bottom: 10px; }
  .content ul { font-size: 15px; line-height: 1.6; margin: 6px 0 12px 22px; }
  .content li { margin-bottom: 5px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card-mini { background: var(--light); border-radius: 16px; padding: 14px; border-top: 4px solid var(--bg-accent); }
  .card-mini h4 { font-size: 14px; color: var(--crust); margin-bottom: 6px; }
  .card-mini p { font-size: 13px; line-height: 1.5; color: var(--ink); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--pale); vertical-align: top; }
  th { background: var(--crust); color: var(--cream); font-weight: 700; }
  tr:nth-child(even) td { background: #fbf6ee; }

  /* Persona */
  .persona-top { display: grid; grid-template-columns: 200px 1fr; gap: 22px; align-items: center; margin-bottom: 18px; }
  .photo-frame {
    width: 200px; height: 250px; border-radius: 20px; overflow: hidden;
    background: linear-gradient(160deg, var(--bg-accent), var(--crust));
    box-shadow: 0 14px 26px rgba(59, 36, 22, .3);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }

  /* Problématique */
  .pain-list { display: grid; gap: 10px; }
  .pain {
    display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--pale);
    border-left: 5px solid var(--fruit); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; line-height: 1.5;
  }
  .statement {
    margin-top: 16px; background: var(--crust); color: var(--cream); border-radius: 16px; padding: 16px 20px;
    font-size: 15px; line-height: 1.55;
  }

  /* Recherche qualitative : question / réponses */
  .qa-q { font-size: 20px; font-weight: 800; color: var(--crust); background: var(--light); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; line-height: 1.3; }
  .qa-a { display: grid; gap: 10px; }
  .qa-item {
    display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--pale);
    border-radius: 14px; padding: 12px 14px; font-size: 14.5px; line-height: 1.5;
  }
  .qa-item .who {
    min-width: 58px; font-size: 11px; font-weight: 800; color: var(--cream); background: var(--bg-accent);
    border-radius: 999px; padding: 4px 8px; text-align: center; margin-top: 2px;
  }
  .qa-takeaway {
    margin-top: 16px; background: var(--crust); color: var(--cream); border-radius: 16px; padding: 14px 18px; font-size: 14.5px; line-height: 1.5;
  }
  .qa-takeaway b { color: var(--citrus); }

  /* Recherche quantitative : graphiques */
  .chart { background: #fff; border: 1px solid var(--pale); border-radius: 18px; padding: 18px 20px; }
  .bar-row { display: grid; grid-template-columns: 150px 1fr 56px; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 14px; }
  .bar-label { font-weight: 700; color: var(--crust); }
  .bar-track { background: var(--light); border-radius: 999px; height: 22px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--bread), var(--citrus));
    width: 0; transition: width 1.1s cubic-bezier(.2, .8, .2, 1);
  }
  .bar-val { font-weight: 800; color: var(--crust); text-align: right; }
  .donut-wrap { display: flex; gap: 28px; align-items: center; }
  .donut {
    width: 210px; height: 210px; border-radius: 50%; flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
    transform: rotate(-90deg);
    animation: spin-in 1.2s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes spin-in { from { transform: rotate(-270deg) scale(.8); opacity: 0; } to { transform: rotate(-90deg) scale(1); opacity: 1; } }
  .legend { display: grid; gap: 10px; font-size: 14px; }
  .legend div { display: flex; align-items: center; gap: 10px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
  .kpi { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .kpi div { background: var(--light); border-radius: 14px; padding: 10px 16px; font-size: 13px; color: var(--muted); }
  .kpi b { display: block; font-size: 22px; color: var(--crust); }

  /* Résultats (synthèse) */
  .insight { background: #fff; border: 1px solid var(--pale); border-radius: 16px; padding: 14px; border-top: 4px solid var(--citrus); }
  .insight h4 { font-size: 14px; color: var(--crust); margin-bottom: 6px; }
  .insight p { font-size: 13px; line-height: 1.5; }
  .insight .impact { margin-top: 8px; color: var(--bg-accent); font-weight: 700; font-size: 12.5px; }

  /* Carte d'empathie */
  .empathy { display: grid; grid-template-columns: 1fr 190px 1fr; gap: 14px 22px; align-items: center; }
  .emp-box { background: var(--light); border: 2px solid var(--pale); border-radius: 22px; padding: 14px 16px; }
  .emp-box h4 {
    font-size: 13px; font-weight: 800; color: var(--cream); background: var(--bg-accent);
    display: inline-block; padding: 5px 12px; border-radius: 999px; margin-bottom: 8px;
  }
  .emp-box.pain-box h4 { background: var(--fruit); }
  .emp-box ul { font-size: 13px; line-height: 1.5; margin-left: 18px; }
  .emp-box li { margin-bottom: 3px; }
  .emp-center { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .emp-photo {
    width: 170px; height: 170px; border-radius: 50%; overflow: hidden; border: 5px solid var(--citrus);
    box-shadow: 0 12px 24px rgba(59, 36, 22, .3); background: linear-gradient(160deg, var(--bg-accent), var(--crust));
  }
  .emp-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .emp-name { font-size: 14px; font-weight: 800; color: var(--crust); }
  .emp-left-top { grid-column: 1; grid-row: 1; }
  .emp-right-top { grid-column: 3; grid-row: 1; }
  .emp-left-bottom { grid-column: 1; grid-row: 2; }
  .emp-right-bottom { grid-column: 3; grid-row: 2; }

  /* Parcours utilisateur */
  .jm-top { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-bottom: 10px; }
  .jm-cell { background: var(--light); border: 1px solid var(--pale); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.45; }
  .jm-head { font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 4px; }
  .jm-grid { display: grid; grid-template-columns: 110px repeat(5, 1fr); gap: 8px; align-items: stretch; }
  .jm-label {
    background: var(--crust); color: var(--cream); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: 800; font-size: 12px; padding: 6px;
  }
  .jm-chev {
    background: var(--bread); color: var(--cream); padding: 10px 16px; font-weight: 800; font-size: 13px; text-align: center;
    clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%, 10% 50%);
  }
  .jm-cell2 { background: #fff; border: 1px solid var(--pale); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; min-height: 64px; }
  .jm-curve { grid-column: 2 / span 5; position: relative; height: 96px; background: #fff; border: 1px solid var(--pale); border-radius: 10px; }
  .jm-curve svg { width: 100%; height: 100%; }
  .jm-axis { text-align: right; font-size: 12px; font-weight: 800; color: var(--muted); margin-top: 6px; }

  /* Carte d'expérience */
  .ce-head { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 800; color: var(--crust); margin-bottom: 12px; }
  .ce-head span { color: var(--muted); font-weight: 700; }
  .ce-grid { display: grid; grid-template-columns: 110px repeat(5, 1fr); gap: 8px; }
  .ce-label {
    background: var(--crust); color: var(--cream); border-radius: 10px; font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .6px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px;
  }
  .ce-stage {
    background: #d7c8b5; color: var(--crust); padding: 10px 14px; font-size: 12.5px; font-weight: 800; text-align: center;
    clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%, 10% 50%);
  }
  .ce-stage.s2 { background: #c9b59c; }
  .ce-stage.s3 { background: #b59c7e; color: var(--cream); }
  .ce-stage.s4 { background: #9c7e5f; color: var(--cream); }
  .ce-stage.s5 { background: #7e6246; color: var(--cream); }
  .ce-cell { background: #fff; border: 1px solid var(--pale); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; min-height: 96px; }
  .ce-cell ul { margin-left: 14px; }
  .ce-cell li { margin-bottom: 3px; }
  .mood-row { display: flex; gap: 8px; align-items: center; justify-content: center; min-height: 64px; }
  .mood { width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
  .mood.good { background: var(--green); }
  .mood.bad { background: var(--fruit); }
  .mood.mid { background: var(--citrus); color: var(--crust); }
  .ce-quote { font-style: italic; color: var(--ink); }

  /* User flow */
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .flow-node { background: var(--bg-main); color: var(--cream); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 700; }
  .flow-arrow { color: var(--bread); font-size: 20px; font-weight: 800; }

  /* Wireframes */
  .wf-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .wf-item { text-align: center; }
  .wf-img {
    width: 100%; height: 300px; border-radius: 16px; overflow: hidden; background: #fff;
    border: 2px solid var(--pale); display: flex; align-items: center; justify-content: center;
  }
  .wf-img img { width: 100%; height: 100%; object-fit: contain; }
  .wf-label { font-size: 12.5px; font-weight: 800; color: var(--crust); margin-top: 8px; }

  /* Contrôles */
  .controls { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 16px; }
  .dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; max-width: 90vw; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 252, 247, .4); border: 0; cursor: pointer;
    transition: transform .3s ease, background .3s ease;
  }
  .dot.active { background: var(--citrus); transform: scale(1.55); }
  .nav { display: flex; gap: 14px; }
  .nav button {
    background: var(--cream); color: var(--crust); border: 0; border-radius: 999px; padding: 9px 22px;
    font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 8px 18px rgba(0, 0, 0, .2); font-family: inherit;
  }
  .nav button:disabled { opacity: .4; cursor: default; }

  @media (max-width: 1100px) {
    .wf-row { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 920px) {
    .stage { grid-template-columns: 1fr; }
    .stack-wrap { display: none; }
    .slide-title { font-size: 24px; }
    .cover .slide-title { font-size: 32px; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .info-grid { grid-template-columns: 1fr; }
    .persona-top { grid-template-columns: 1fr; justify-items: center; }
    .empathy { grid-template-columns: 1fr; }
    .emp-center, .emp-left-top, .emp-right-top, .emp-left-bottom, .emp-right-bottom { grid-column: 1; grid-row: auto; }
    .emp-center { order: -1; }
    .donut-wrap { flex-direction: column; }
  }
  @media (max-width: 600px) {
    .stage { padding: 0 16px; }
    .main-card { padding: 22px; }
    .grid-2, .grid-3, .grid-4, .wf-row { grid-template-columns: 1fr; }
    .jm-grid, .ce-grid { overflow-x: auto; }
    .bar-row { grid-template-columns: 110px 1fr 46px; }
  }
</style>
</head>
<body>

<div class="curtain" id="curtain" aria-hidden="true">
  <div class="curtain-half curtain-left"></div>
  <div class="curtain-half curtain-right"></div>
</div>

<div class="topbar">
  <span class="brand">Livraison Campus CMC Rabat</span>
  <span class="counter" id="counter"></span>
  <button class="fs-btn" id="fsBtn" type="button">Plein écran</button>
</div>

<div class="stage">
  <div class="stack-wrap"><div class="stack" id="stack"></div></div>
  <div class="main-wrap">
    <div class="main-card" id="mainCard">
      <div class="content" id="mainContent"></div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="nav">
    <button id="prevBtn" type="button">← Précédent</button>
    <button id="nextBtn" type="button">Suivant →</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>

  const BAR_COLORS = ["#d9822b", "#4c8c58", "#d94e4e", "#f2b705"];

  function barChart(bloc) {
    const max = Math.max(...bloc.series.map(s => s.valeur));
    const rows = bloc.series.map(s => `
      <div class="bar-row">
        <div class="bar-label">${s.label}</div>
        <div class="bar-track"><div class="bar-fill" data-w="${(s.valeur / max) * 100}"></div></div>
        <div class="bar-val">${s.valeur}%</div>
      </div>`).join("");
    return `<div class="chart">${rows}</div>`;
  }

  function donutChart(bloc) {
    const total = bloc.series.reduce((a, s) => a + s.valeur, 0);
    let acc = 0;
    const stops = bloc.series.map(s => {
      const start = (acc / total) * 100;
      acc += s.valeur;
      const end = (acc / total) * 100;
      return `${s.couleur} ${start}% ${end}%`;
    }).join(", ");
    const legend = bloc.series.map(s => `
      <div><span class="swatch" style="background:${s.couleur}"></span>${s.label} : <b>${s.valeur}%</b></div>`).join("");
    return `
      <div class="chart donut-wrap">
        <div class="donut" style="background: conic-gradient(${stops});"></div>
        <div class="legend">${legend}</div>
      </div>`;
  }

  function animateBars() {

      <div class="jm-axis">Temps →</div>
    `
  });

  /* User flow */
  S.push({
    section: "Partie 11",
    title: SECTIONS[10],
    html: `
      <p class="lead">Chemin principal de la commande, de la connexion à la récupération, tel qu’il apparaît dans les wireframes.</p>
      <div class="flow">
        <span class="flow-node">Connexion</span><span class="flow-arrow">→</span>
        <span class="flow-node">Snacks</span><span class="flow-arrow">→</span>
        <span class="flow-node">Détail snack</span><span class="flow-arrow">→</span>
        <span class="flow-node">Panier</span><span class="flow-arrow">→</span>
        <span class="flow-node">Paiement</span><span class="flow-arrow">→</span>
        <span class="flow-node">Suivi en direct</span><span class="flow-arrow">→</span>
        <span class="flow-node">Retrait</span>
      </div>
    `
  });

  /* Wireframes */
  S.push({
    section: "Partie 12",
    title: SECTIONS[11],
    html: `
      <p class="lead">Cinq écrans clés, de la connexion au suivi de la commande.</p>
      <div class="wf-row">
        <div class="wf-item"><div class="wf-img"><img src="wf-login.jpg" alt="Connexion CMC" onerror="this.remove()"></div><div class="wf-label">Connexion</div></div>
        <div class="wf-item"><div class="wf-img"><img src="wf-snacks.jpg" alt="Liste des snacks" onerror="this.remove()"></div><div class="wf-label">Snacks du campus</div></div>
        <div class="wf-item"><div class="wf-img"><img src="wf-snack.jpg" alt="Détail snack" onerror="this.remove()"></div><div class="wf-label">Détail snack</div></div>
        <div class="wf-item"><div class="wf-img"><img src="wf-panier.jpg" alt="Panier" onerror="this.remove()"></div><div class="wf-label">Panier</div></div>
        <div class="wf-item"><div class="wf-img"><img src="wf-suivi.jpg" alt="Suivi en direct" onerror="this.remove()"></div><div class="wf-label">Suivi en direct</div></div>
      </div>
    `
  });

  /* =====================================================================
     MOTEUR DE PRÉSENTATION
     ===================================================================== */
  let cur = 0;
  const stackEl = document.getElementById("stack");
  const mainCard = document.getElementById("mainCard");
  const mainContent = document.getElementById("mainContent");
  const counter = document.getElementById("counter");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const dotsEl = document.getElementById("dots");
  const fsBtn = document.getElementById("fsBtn");
  const curtain = document.getElementById("curtain");

  const POS = [
    { x: 0,   y: 0,   s: 1,   r: -10, o: 1,   z: 30 },
    { x: 60,  y: -40, s: .92, r: -16, o: .72, z: 20 },
    { x: 115, y: -78, s: .84, r: -22, o: .45, z: 10 }
  ];

  function applyPos(el, p) {
    el.style.transform = `translate3d(${p.x}px, ${p.y}px, ${p.z}px) rotateY(${p.r}deg) scale(${p.s})`;
    el.style.opacity = p.o;
    el.style.zIndex = p.z;
  }

  function renderStack() {
    stackEl.innerHTML = "";
    for (let k = 2; k >= 0; k--) {
      const idx = cur + k;
      if (idx >= S.length) continue;
      const sl = S[idx];
      const d = document.createElement("div");
      d.className = "stack-card";
      d.innerHTML = `
        <div class="sc-top"><b>${String(idx + 1).padStart(2, "0")}</b><span>${sl.section || "Couverture"}</span></div>
        <div class="sc-title">${sl.title}</div>`;
      d.addEventListener("click", () => goTo(idx));
      applyPos(d, POS[k]);
      stackEl.appendChild(d);
    }
  }

  function renderDots() {
    dotsEl.innerHTML = "";
    S.forEach((_, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "dot" + (i === cur ? " active" : "");
      b.setAttribute("aria-label", "Aller à la diapositive " + (i + 1));
      b.addEventListener("click", () => goTo(i));
      dotsEl.appendChild(b);
    });
  }

  function show(idx) {
    cur = idx;
    const sl = S[cur];
    mainCard.classList.toggle("cover", !!sl.cover);

    const body = typeof sl.html === "function" ? sl.html() : sl.html;
    const header = sl.cover
      ? `<h1 class="slide-title">${sl.title}</h1>`
      : `<div class="section-tag">${sl.section}</div><h1 class="slide-title">${sl.title}</h1>`;
    mainContent.innerHTML = header + body;

    mainCard.classList.remove("enter");
    void mainCard.offsetWidth;
    mainCard.classList.add("enter");

    counter.textContent = `${cur + 1} / ${S.length}`;
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === S.length - 1;
    renderDots();
    renderStack();
    animateBars();
    mainContent.scrollTop = 0;
  }

  function goTo(i) {
    if (i < 0 || i >= S.length || i === cur) return;
    show(i);
  }

  function next() { goTo(cur + 1); }
  function prev() { goTo(cur - 1); }

  prevBtn.addEventListener("click", prev);
  nextBtn.addEventListener("click", next);

  mainContent.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-goto]");
    if (btn) goTo(parseInt(btn.getAttribute("data-goto"), 10));
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  });

  fsBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  });
  document.addEventListener("fullscreenchange", () => {
    fsBtn.textContent = document.fullscreenElement ? "Quitter le plein écran" : "Plein écran";
  });

  show(0);
  setTimeout(() => curtain.classList.add("open"), 500);
  setTimeout(() => curtain.classList.add("done"), 2400);
</script>
</body>
</html>
