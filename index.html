<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recherche UX & Wireframes : Livraison Campus CMC Rabat</title>
<style>
  :root {
    /* Palette inspirée des snacks : salade fraîche, pain doré, tomate/fruits rouges, croûte grillée */
    --bg-main: #2d5a3c;       /* Vert salade profond */
    --bg-accent: #4c8c58;     /* Vert frais */
    --crust: #3b2416;         /* Brun pain grillé / expresso */
    --bread: #d9822b;         /* Doré pain / brioche */
    --fruit: #d94e4e;         /* Rouge tomate / fraise */
    --citrus: #f2b705;        /* Jaune agrume */
    --cream: #fffcf7;         /* Blanc crème farine */
    --ink: #2a1f18;
    --muted: #6e5d52;
    --light: #f6efe6;
    --pale: #e6dacb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at 20% 20%, #3d754e 0%, var(--bg-main) 65%, #1e3f29 100%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    user-select: none;
    position: relative;
  }

  /* Décoration subtile en arrière-plan (formes organiques fruits / feuilles / pains, sans logo) */
  .bg-decor {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; opacity: 0.14;
  }
  .bg-decor svg { width: 100%; height: 100%; }

  /* ---------- Barre supérieure ---------- */
  .topbar {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 40px; color: var(--cream); font-weight: 600; font-size: 14px; letter-spacing: .4px;
  }
  .topbar .brand { opacity: .92; }
  .topbar .counter { opacity: .92; }
  .fs-btn {
    background: rgba(255,252,247,.16); border: 1px solid rgba(255,252,247,.35);
    color: var(--cream); padding: 7px 15px; border-radius: 999px; cursor: pointer; font-size: 13px;
  }
  .fs-btn:hover { background: rgba(255,252,247,.28); }

  /* ---------- Scène : pile de cartes + carte principale ---------- */
  .stage {
    position: relative; z-index: 2;
    flex: 1; display: grid; grid-template-columns: 33% 1fr; gap: 28px;
    padding: 0 40px; min-height: 0;
  }

  .stack-wrap {
    position: relative; perspective: 1400px; display: flex; align-items: center; justify-content: center;
  }
  .stack {
    position: relative; width: 100%; max-width: 400px; height: 420px;
    transform-style: preserve-3d;
  }
  .stack-card {
    position: absolute; left: 0; top: 50%; width: 100%; height: 340px; margin-top: -170px;
    background: var(--cream); border-radius: 24px; padding: 26px;
    box-shadow: 0 22px 44px rgba(18, 32, 20, .35);
    transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .9s ease;
    transform-origin: center;
    display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    border-top: 6px solid var(--bread);
  }
  .stack-card .sc-num { font-size: 13px; font-weight: 800; color: var(--bread); letter-spacing: 1px; }
  .stack-card .sc-title { font-size: 20px; font-weight: 800; color: var(--crust); line-height: 1.25; }
  .stack-card .sc-sec { font-size: 12px; color: var(--muted); font-weight: 600; }
  .stack-card .sc-bar { height: 8px; border-radius: 8px; background: var(--pale); overflow: hidden; }
  .stack-card .sc-bar span { display: block; height: 100%; background: var(--bg-accent); border-radius: 8px; }

  .main-wrap { position: relative; display: flex; align-items: center; min-height: 0; }
  .main-card {
    position: relative; width: 100%; height: min(74vh, 640px);
    background: var(--cream); border-radius: 30px; padding: 36px 44px;
    box-shadow: 0 30px 60px rgba(15, 28, 18, .38);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .main-card.enter { animation: enter .7s cubic-bezier(.2,.8,.2,1); }
  @keyframes enter {
    from { opacity: 0; transform: translateX(40px) scale(.98); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  .section-tag {
    font-size: 12px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; color: var(--bread);
  }
  .slide-title { font-size: 32px; font-weight: 800; color: var(--crust); margin: 6px 0 16px; line-height: 1.15; }
  .content { flex: 1; min-height: 0; overflow: auto; padding-right: 6px; }
  .footnote { font-size: 12px; color: var(--muted); margin-top: 12px; }

  /* Couverture & Merci */
  .cover { background: linear-gradient(135deg, var(--crust) 0%, #52321e 100%) !important; color: var(--cream) !important; justify-content: center; }
  .cover .slide-title { font-size: 40px; color: var(--cream); margin: 12px 0 16px; }
  .cover .sub { font-size: 19px; color: var(--citrus); margin-bottom: 24px; font-weight: 600; }
  .cover .meta { font-size: 15px; opacity: .88; line-height: 1.6; }
  .cover .section-tag { color: #f48c5b; }
  .food-pills { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .food-pill {
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
    background: rgba(255,252,247,.12); border: 1px solid rgba(255,252,247,.25); color: var(--cream);
  }

  /* Cartes génériques */
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .box { background: var(--light); border-radius: 18px; padding: 18px 20px; border: 1px solid #eadfce; }
  .box h4 { font-size: 16px; color: var(--crust); margin-bottom: 8px; }
  .box p, .box li { font-size: 14.5px; line-height: 1.45; }
  .box ul { padding-left: 18px; }
  .tint-fruit { background: #fbeaea; border-color: #f3cece; }
  .tint-salad { background: #e8f3eb; border-color: #c8e2cf; }
  .tint-bread { background: #fdf2e3; border-color: #f4dcba; }
  .dark { background: var(--crust); color: var(--cream); border: none; }
  .dark h4 { color: var(--citrus); }
  .q { font-weight: 700; color: var(--crust); font-size: 16.5px; margin-bottom: 8px; }
  .answer-label { font-size: 12px; font-weight: 800; letter-spacing: 1px; color: var(--bg-main); text-transform: uppercase; margin-bottom: 8px; }

  /* Barres de résultats */
  .bars { display: flex; flex-direction: column; gap: 11px; }
  .bar-row { display: grid; grid-template-columns: 225px 1fr 60px; align-items: center; gap: 12px; font-size: 14.5px; }
  .bar-track { height: 20px; background: var(--pale); border-radius: 12px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 12px; background: var(--fruit); transform-origin: left; animation: grow .9s ease both; }
  .bar-fill.salad { background: var(--bg-accent); }
  .bar-fill.bread { background: var(--bread); }
  .bar-fill.crust { background: var(--crust); }
  .bar-val { font-weight: 800; color: var(--crust); text-align: right; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* ---------- USER FLOW DIAGRAMME (Bas-fidélité / UX) ---------- */
  .flow-board {
    display: flex; flex-direction: column; gap: 14px; background: #fff;
    border: 2px dashed #cbbba8; border-radius: 18px; padding: 16px;
  }
  .flow-lane {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 12px; border-radius: 12px; background: var(--light);
  }
  .lane-title {
    width: 110px; font-size: 12px; font-weight: 800; text-transform: uppercase;
    color: var(--crust); flex-shrink: 0;
  }
  .fn-screen {
    background: #fde68a; border: 1.5px solid #b45309; color: #451a03;
    padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; text-align: center;
  }
  .fn-action {
    background: #bbf7d0; border: 1.5px solid #15803d; color: #052e16;
    padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; text-align: center;
  }
  .fn-decision {
    background: #bae6fd; border: 1.5px solid #0369a1; color: #082f49;
    padding: 6px 10px; border-radius: 4px; font-size: 11.5px; font-weight: 700;
    transform: skewX(-8deg);
  }
  .fn-arrow { font-weight: 800; color: var(--muted); font-size: 14px; }

  /* ---------- WIREFRAMES UX (Basse fidélité / Noir & Blanc / Sans UI) ---------- */
  .wf-showcase {
    display: grid; grid-template-columns: 270px 1fr; gap: 24px; align-items: start;
  }
  .wf-phone {
    width: 265px; background: #ffffff; border: 2.5px solid #2b2b2b; border-radius: 22px;
    padding: 14px 14px 10px; font-family: Arial, Helvetica, sans-serif; color: #222;
    box-shadow: 6px 6px 0px #d6cec2;
  }
  .wf-meta-top { font-size: 9.5px; color: #666; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 4px; }
  .wf-h1 { font-size: 17px; font-weight: 800; color: #111; margin-bottom: 4px; }
  .wf-sub { font-size: 11px; color: #555; margin-bottom: 10px; line-height: 1.3; }
  .wf-img-box {
    border: 1.5px solid #888; background: #f5f5f5; position: relative;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .wf-img-box svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wf-input {
    border: 1.5px solid #666; padding: 7px 9px; font-size: 11px; color: #777;
    background: #fff; margin-bottom: 8px;
  }
  .wf-label { font-size: 11px; font-weight: 700; margin-bottom: 3px; color: #222; }
  .wf-card {
    border: 1.5px solid #777; padding: 8px; margin-bottom: 8px; display: flex; gap: 9px; align-items: center;
  }
  .wf-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
  .wf-tab {
    border: 1.5px solid #666; text-align: center; padding: 5px 2px; font-size: 11px; font-weight: 700;
  }
  .wf-tab.active { background: #dcdcdc; }
  .wf-btn {
    border: 1.5px solid #333; background: #e0e0e0; text-align: center;
    padding: 8px; font-size: 12px; font-weight: 800; color: #111; margin-top: 8px;
  }
  .wf-btn-outline {
    border: 1.5px solid #444; background: #fff; text-align: center;
    padding: 6px; font-size: 11px; font-weight: 700; color: #111;
  }
  .wf-footer {
    border-top: 1px solid #ccc; margin-top: 10px; padding-top: 6px;
    font-size: 9.5px; color: #666; display: flex; justify-content: space-between;
  }
  .wf-homebar { width: 64px; height: 3px; background: #333; margin: 6px auto 0; border-radius: 2px; }

  /* ---------- Contrôles ---------- */
  .controls {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0 18px;
  }
  .dots { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; max-width: 90vw; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; background: rgba(255,252,247,.4); border: 0; cursor: pointer;
    transition: transform .3s ease, background .3s ease;
  }
  .dot.active { background: var(--citrus); transform: scale(1.55); }
  .nav { display: flex; gap: 14px; }
  .nav button {
    background: var(--cream); color: var(--crust); border: 0; border-radius: 999px; padding: 9px 22px;
    font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 8px 18px rgba(0,0,0,.2);
  }
  .nav button:disabled { opacity: .4; cursor: default; }

  @media (max-width: 920px) {
    .stage { grid-template-columns: 1fr; }
    .stack-wrap { display: none; }
    .wf-showcase { grid-template-columns: 1fr; justify-items: center; }
    .grid3, .grid2 { grid-template-columns: 1fr; }
    .slide-title { font-size: 25px; }
  }
</style>
</head>
<body>

<!-- Fond illustratif léger : silhouettes abstraites de pains, feuilles de salade et fruits (sans logo) -->
<div class="bg-decor" aria-hidden="true">
  <svg viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Pain / Baguette stylisée en haut à gauche -->
    <rect x="60" y="90" width="240" height="95" rx="47" transform="rotate(-18 60 90)" fill="#f2b705"/>
    <path d="M110 95 L135 125 M155 82 L180 112 M200 70 L225 100" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <!-- Tranche d'agrume / fruit en bas à gauche -->
    <circle cx="170" cy="760" r="110" fill="#d94e4e"/>
    <circle cx="170" cy="760" r="82" stroke="#fff" stroke-width="5" stroke-dasharray="18 14"/>
    <!-- Feuille de salade / herbes à droite -->
    <path d="M1260 140 C1340 120, 1410 210, 1340 290 C1270 370, 1180 280, 1260 140 Z" fill="#a3e635"/>
    <path d="M1265 165 Q1300 220 1330 275" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <!-- Bol de salade / snack en bas à droite -->
    <path d="M1140 720 H1380 C1380 800, 1320 845, 1260 845 C1200 845, 1140 800, 1140 720 Z" fill="#d9822b"/>
    <circle cx="1210" cy="705" r="28" fill="#a3e635"/>
    <circle cx="1265" cy="698" r="32" fill="#d94e4e"/>
    <circle cx="1320" cy="708" r="26" fill="#f2b705"/>
  </svg>
</div>

<div class="topbar">
  <span class="brand">Projet UX · Livraison Snacks & Repas · Campus CMC Rabat</span>
  <span class="counter" id="counter"></span>
  <button class="fs-btn" id="fsBtn" title="Plein écran (F)">Plein écran</button>
</div>

<div class="stage">
  <div class="stack-wrap">
    <div class="stack" id="stack"></div>
  </div>
  <div class="main-wrap">
    <div class="main-card" id="mainCard"><div class="content" id="mainContent"></div></div>
  </div>
</div>

<div class="controls">
  <div class="nav">
    <button id="prevBtn">← Précédent</button>
    <button id="nextBtn">Suivant →</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
/* ==================================================================
   SECTIONS SELON VOTRE SOMMAIRE
   ================================================================== */
const SECTIONS = [
  "Recherche qualitative - Les résultats",
  "User Flow (Parcours utilisateur)",
  "Prototype UX : Wireframes (Basse fidélité)",
  "Conclusion & Merci"
];

// Helper pour l'espace réservé d'image wireframe (croix UX standard)
const wfPlaceholder = (w, h, label = "") => `
  <div class="wf-img-box" style="width:${w};height:${h};flex-shrink:0">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <line x1="0" y1="0" x2="100" y2="100" stroke="#999" stroke-width="1.5"/>
      <line x1="100" y1="0" x2="0" y2="100" stroke="#999" stroke-width="1.5"/>
    </svg>
    ${label ? `<span style="position:relative;background:#fff;padding:2px 5px;font-size:10px;font-weight:800;border:1px solid #888">${label}</span>` : ""}
  </div>`;

const bars = (rows, max, unit = "/9", cls = "salad") =>
  `<div class="bars">${rows.map(([label, v]) => `
    <div class="bar-row">
      <span>${label}</span>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${(v / max) * 100}%"></div></div>
      <span class="bar-val">${v}${unit}</span>
    </div>`).join("")}</div>`;

const S = [];

/* ---------------- 0. COUVERTURE ---------------- */
S.push({
  cover: true, section: "",
  title: "Application de livraison de repas & snacks pour les stagiaires CMC Rabat",
  html: `<div class="food-pills">
           <span class="food-pill">Sandwichs & Pains chauds</span>
           <span class="food-pill">Salades fraîches</span>
           <span class="food-pill">Fruits & Jus naturels</span>
           <span class="food-pill">Snacks partenaires</span>
         </div>
         <div class="sub">Recherche qualitative, User Flow et Wireframes UX (Basse fidélité)</div>
         <div class="meta">Écosystème : Stagiaires CMC · Snacks & Restaurants · Livreurs Campus<br>Filière Design Digital UX/UI · CMC Rabat (Tamesna)</div>`
});

/* ---------------- 1. SOMMAIRE ---------------- */
S.push({ section: "Sommaire", title: "Sommaire de la présentation", html: "__SOMMAIRE__" });

/* ==================================================================
   SECTION 1 : RECHERCHE QUALITATIVE - LES RÉSULTATS
   ================================================================== */
S.push({
  section: SECTIONS[0],
  title: "Objectif et acteurs interrogés (Entretiens)",
  html: `<div class="box dark" style="margin-bottom:16px">
           <p style="font-size:16px;line-height:1.5">Comprendre les habitudes alimentaires pendant la pause déjeuner à la CMC Rabat et identifier les blocages entre <b>stagiaires</b>, <b>snacks/restaurants</b> et <b>livreurs</b>.</p>
         </div>
         <div class="grid3">
           <div class="box tint-salad">
             <h4>Stagiaires CMC (5 entretiens)</h4>
             <ul>
               <li>Pause courte (30 à 45 min)</li>
               <li>Budget étudiant (20 à 35 DH)</li>
               <li>Besoin de repas rapides : sandwichs, salades, tacos, fruits</li>
             </ul>
           </div>
           <div class="box tint-bread">
             <h4>Snacks & Restaurants (2 entretiens)</h4>
             <ul>
               <li>Saturation entre 12h10 et 12h30</li>
               <li>Commandes téléphoniques confuses</li>
               <li>Besoin d'anticiper la préparation</li>
             </ul>
           </div>
           <div class="box tint-fruit">
             <h4>Livreurs Campus (2 entretiens)</h4>
             <ul>
               <li>Perte de temps aux accès du campus</li>
               <li>Appels multiples pour localiser le stagiaire</li>
               <li>Besoin d'un point de retrait unique</li>
             </ul>
           </div>
         </div>`
});

S.push({
  section: SECTIONS[0],
  title: "Résultats qualitatifs : irritants récurrents",
  html: `<div class="q">Fréquence des problèmes cités lors des 9 entretiens semi-directifs</div>
         <div class="answer-label">Synthèse des retours terrain</div>
         ${bars([
           ["Files d'attente trop longues aux snacks", 9],
           ["Crainte d'arriver en retard en cours/atelier", 8],
           ["Manque de visibilité sur les menus et prix", 7],
           ["Frais de livraison élevés pour un seul stagiaire", 6],
           ["Difficulté du livreur à trouver l'entrée", 5]
         ], 9, "/9", "bread")}
         <div class="box tint-salad" style="margin-top:16px">
           <p><b>Enseignement clé UX :</b> Le système doit intégrer la <b>précommande avant la pause</b>, le <b>panier partagé (commande groupée)</b> entre camarades et un <b>point de collecte fixe</b> à la porte principale.</p>
         </div>`
});

S.push({
  section: SECTIONS[0],
  title: "Verbatims et besoins fonctionnels déduits",
  html: `<div class="grid3">
           <div class="box">
             <h4>Parole de Stagiaire</h4>
             <p><i>« À 12h15, tout le monde sort en même temps. Si j'attends 20 minutes au snack, je n'ai plus le temps de manger. »</i></p>
             <p style="margin-top:10px;color:var(--bg-main)"><b>→ Solution UX :</b> Précommande horodatée + suivi en direct.</p>
           </div>
           <div class="box">
             <h4>Parole de Gérant Snack</h4>
             <p><i>« Si je reçois les commandes 20 minutes avant la pause, je prépare les pains et salades à l'avance sans erreur. »</i></p>
             <p style="margin-top:10px;color:var(--bg-main)"><b>→ Solution UX :</b> File de préparation planifiée.</p>
           </div>
           <div class="box">
             <h4>Parole de Livreur</h4>
             <p><i>« Déposer toutes les commandes groupées à la Porte Principale avec un QR code me fait gagner 10 minutes par trajet. »</i></p>
             <p style="margin-top:10px;color:var(--bg-main)"><b>→ Solution UX :</b> Validation rapide par QR Code.</p>
           </div>
         </div>`
});

/* ==================================================================
   SECTION 2 : USER FLOW (PARCOURS UTILISATEUR)
   ================================================================== */
S.push({
  section: SECTIONS[1],
  title: "User Flow global : Stagiaire · Snack · Livreur",
  html: `<div class="flow-board">
           <div class="flow-lane">
             <span class="lane-title">1. Accès & Choix</span>
             <span class="fn-action">Ouvrir l'app</span><span class="fn-arrow">→</span>
             <span class="fn-screen">Connexion Email CMC</span><span class="fn-arrow">→</span>
             <span class="fn-screen">Liste Snacks Campus</span><span class="fn-arrow">→</span>
             <span class="fn-screen">Menu (Pains, Salades, Fruits)</span><span class="fn-arrow">→</span>
             <span class="fn-action">Ajouter au panier</span>
           </div>
           <div class="flow-lane">
             <span class="lane-title">2. Panier & Groupe</span>
             <span class="fn-decision">Commande groupée ?</span><span class="fn-arrow">→</span>
             <span class="fn-action">Oui : Inviter camarades</span><span class="fn-arrow">→</span>
             <span class="fn-screen">Créneau pause (ex: 12h30)</span><span class="fn-arrow">→</span>
             <span class="fn-screen">Point collecte CMC</span><span class="fn-arrow">→</span>
             <span class="fn-action">Payer sa part</span>
           </div>
           <div class="flow-lane">
             <span class="lane-title">3. Préparation Snack</span>
             <span class="fn-screen">Tableau de bord Snack</span><span class="fn-arrow">→</span>
             <span class="fn-decision">Plats dispo ?</span><span class="fn-arrow">→</span>
             <span class="fn-action">Préparer commande</span><span class="fn-arrow">→</span>
             <span class="fn-action">Marquer « Prête »</span>
           </div>
           <div class="flow-lane">
             <span class="lane-title">4. Livraison & Retrait</span>
             <span class="fn-screen">Mission Livreur</span><span class="fn-arrow">→</span>
             <span class="fn-action">Trajet vers Porte CMC</span><span class="fn-arrow">→</span>
             <span class="fn-screen">Suivi en direct</span><span class="fn-arrow">→</span>
             <span class="fn-action">Scanner QR Code</span><span class="fn-arrow">→</span>
             <span class="fn-screen">Réception confirmée</span>
           </div>
         </div>
         <p class="footnote">Légende UX : Jaune = Écran / Interface · Vert = Action utilisateur · Bleu = Condition / Décision.</p>`

(function buildSommaire() {
  const firstIdx = {};
  S.forEach((sl, i) => {
    if (sl.section && sl.section !== "Sommaire" && firstIdx[sl.section] === undefined) firstIdx[sl.section] = i;
  });
  const colors = ["#d9822b", "#2d5a3c", "#d94e4e", "#3b2416"];
  const items = SECTIONS.map((name, k) => {
    const start = firstIdx[name];
    const end = Math.max(...S.map((sl, i) => (sl.section === name ? i : -1)));
    const pg = start === end ? `Slide ${start + 1}` : `Slides ${start + 1} à ${end + 1}`;
    return `<div style="display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:14px;padding:12px 16px;background:var(--light);border-radius:16px;border:1px solid #eadfce">
              <span style="width:36px;height:36px;border-radius:50%;background:${colors[k % colors.length]};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px">${k + 1}</span>
              <span style="font-weight:800;color:var(--crust);font-size:18px">${name}</span>
              <span style="color:var(--muted);font-size:14px;font-weight:600">${pg}</span>
            </div>`;
  }).join("");
  S[1].html = `<div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">${items}</div>`;
})();

/* ==================================================================
   MOTEUR DE PRÉSENTATION 3D (IDENTIQUE AU MODÈLE)
   ================================================================== */
let cur = 0;
const stackEl = document.getElementById("stack");
const mainCard = document.getElementById("mainCard");
const mainContent = document.getElementById("mainContent");
const dotsEl = document.getElementById("dots");
const counter = document.getElementById("counter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const POS = [
  { tx: 0,    ty: 0,   sc: 1,    ry: -10, op: 1,   z: 30 },
  { tx: 70,   ty: -44, sc: .92,  ry: -16, op: .72, z: 20 },
  { tx: 130,  ty: -86, sc: .84,  ry: -22, op: .45, z: 10 },
];
const HIDDEN_BACK = { tx: 200, ty: -120, sc: .78, ry: -26, op: 0, z: 0 };
const HIDDEN_FRONT = { tx: -120, ty: 0, sc: .9, ry: 0, op: 0, z: 40 };

function applyPos(el, p, animate = true) {
  el.style.transition = animate ? "" : "none";
  el.style.transform = `translate3d(${p.tx}px, ${p.ty}px, ${p.z}px) rotateY(${p.ry}deg) scale(${p.sc})`;
  el.style.opacity = p.op;
  el.style.zIndex = p.z;
}

function fillCard(el, idx) {
  const sl = S[idx];
  if (!sl) { el.style.visibility = "hidden"; return; }
  el.style.visibility = "visible";
  el.innerHTML = `<div><div class="sc-num">${String(idx + 1).padStart(2, "0")}</div>
                  <div class="sc-sec" style="margin-top:8px">${sl.section || "Couverture"}</div></div>
                  <div class="sc-title">${sl.title}</div>
                  <div class="sc-bar"><span style="width:${((idx + 1) / S.length) * 100}%"></span></div>`;
}

let cards = [];
function buildStack() {
  stackEl.innerHTML = "";
  cards = [0, 1, 2].map(() => {
    const d = document.createElement("div");
    d.className = "stack-card";
    stackEl.appendChild(d);
    return d;
  });
  cards.forEach((el, k) => { fillCard(el, cur + k); applyPos(el, POS[k], false); });
}

function renderDots() {
  dotsEl.innerHTML = "";
  S.forEach((_, i) => {
    const b = document.createElement("button");
    b.className = "dot" + (i === cur ? " active" : "");
    b.title = "Slide " + (i + 1);
    b.onclick = () => goTo(i);
    dotsEl.appendChild(b);
  });
}

function renderMain(animate = true) {
  mainContent.innerHTML = `${S[cur].section && !S[cur].cover ? `<div class="section-tag">${S[cur].section}</div>` : ""}
    ${S[cur].cover ? "" : `<div class="slide-title">${S[cur].title}</div>`}
    ${S[cur].html}`;
  if (S[cur].cover) {
    mainCard.classList.add("cover");
    const tag = cur === 0 ? "UX Design · Campus CMC Rabat" : "Fin de présentation";
    mainContent.innerHTML = `<div class="section-tag">${tag}</div><div class="slide-title">${S[cur].title}</div>${S[cur].html}`;
    mainContent.style.display = "flex"; mainContent.style.flexDirection = "column"; mainContent.style.justifyContent = "center";
  } else {
    mainCard.classList.remove("cover");
    mainContent.style.display = ""; mainContent.style.flexDirection = ""; mainContent.style.justifyContent = "";
  }
  if (animate) {
    mainCard.classList.remove("enter");
    void mainCard.offsetWidth;
    mainCard.classList.add("enter");
  }
  counter.textContent = `${cur + 1} / ${S.length}`;
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === S.length - 1;
  renderDots();
}

let busy = false;
function lock() { busy = true; setTimeout(() => { busy = false; }, 950); }

function next() {
  if (busy || cur >= S.length - 1) return;
  lock();
  const front = cards[0];
  applyPos(front, { ...HIDDEN_FRONT, tx: 260, ty: 0, sc: 1.05, ry: 0, op: 0, z: 60 });
  setTimeout(() => {
    cur++;
    renderMain(true);
    fillCard(front, cur + 2);
    applyPos(front, HIDDEN_BACK, false);
    cards = [cards[1], cards[2], front];
    cards.forEach((el, k) => applyPos(el, POS[k], true));
    front.style.transition = "transform .9s cubic-bezier(.2,.8,.2,1), opacity .9s ease";
    requestAnimationFrame(() => { applyPos(front, POS[2], true); });
  }, 380);
}

function prev() {
  if (busy || cur <= 0) return;
  lock();
  const back = cards[2];
  cur--;
  fillCard(back, cur);
  applyPos(back, { ...HIDDEN_FRONT, tx: -140, op: 0 }, false);
  renderMain(true);
  cards = [back, cards[0], cards[1]];
  requestAnimationFrame(() => {
    cards.forEach((el, k) => applyPos(el, POS[k], true));
  });
  setTimeout(() => { cards.forEach((el, k) => { if (!S[cur + k]) el.style.visibility = "hidden"; }); }, 0);
}

function goTo(i) {
  if (i === cur) return;
  if (i > cur) { const step = () => { if (cur < i) { next(); setTimeout(step, 960); } }; step(); }
  else { const step = () => { if (cur > i) { prev(); setTimeout(step, 960); } }; step(); }
}

prevBtn.onclick = () => prev();
nextBtn.onclick = () => next();

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "Home") goTo(0);
  else if (e.key === "End") goTo(S.length - 1);
  else if (e.key === "f" || e.key === "F") toggleFs();
});

const fsBtn = document.getElementById("fsBtn");
function toggleFs() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
fsBtn.onclick = toggleFs;

buildStack();
renderMain(false);
</script>
