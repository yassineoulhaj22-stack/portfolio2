<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Étude UX Design — Application de Livraison CMC Rabat</title>
<style>
  :root {
    --bg-teal: #3A9AB2;
    --bg-teal-dark: #256D80;
    --card-bg: #FFFFFF;
    --dark-ink: #102A33;
    --text-body: #334E58;
    --text-muted: #627D87;
    --gold: #D4AF37;
    --gold-light: #FBF6E6;
    --accent-grad: linear-gradient(135deg, #5B6CF9 0%, #3A9AB2 55%, #2EB88A 100%);
    --soft-surface: #F2F7F9;
    --border-subtle: #DCE8ED;
    --flow-action: #2EB88A;
    --flow-screen: #F4C430;
    --flow-decision: #3A9AB2;
    --radius-card: 24px;
    --shadow-card: 0 24px 60px rgba(16, 42, 51, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 15% 15%, #4BB3CC 0%, var(--bg-teal) 55%, var(--bg-teal-dark) 100%);
    color: var(--dark-ink);
    user-select: none;
  }

  /* Motifs géométriques subtils en arrière-plan */
  .ambient-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .ambient-bg::before, .ambient-bg::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.07);
  }
  .ambient-bg::before { width: 520px; height: 520px; top: -160px; right: -120px; }
  .ambient-bg::after { width: 420px; height: 420px; bottom: -140px; left: -100px; }

  /* Barre supérieure */
  .topbar {
    position: relative;
    z-index: 10;
    height: 64px;
    padding: 0 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #fff;
  }
  .brand-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.4px;
    background: rgba(16, 42, 51, 0.22);
    padding: 8px 16px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--gold);
  }
  .top-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .slide-counter {
    font-size: 13px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.16);
    padding: 7px 14px;
    border-radius: 999px;
  }
  .top-btn {
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.35);
    color: #fff;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .top-btn:hover {
    background: #fff;
    color: var(--dark-ink);
  }
  .top-btn.gold-btn {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--dark-ink);
  }
  .top-btn.gold-btn:hover {
    background: #e8c348;
  }

  /* Scène principale */
  .viewport {
    position: relative;
    z-index: 5;
    height: calc(100vh - 132px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 36px;
    perspective: 1600px;
  }

  .slide-card {
    width: 100%;
    max-width: 1260px;
    height: 100%;
    max-height: 700px;
    background: var(--card-bg);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 36px 46px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    transform-style: preserve-3d;
    animation: slideMorphIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .slide-card.prev-anim {
    animation: slideMorphPrev 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes slideMorphIn {
    0% {
      opacity: 0;
      transform: translateX(70px) rotateY(-8deg) scale(0.95);
    }
    100% {
      opacity: 1;
      transform: translateX(0) rotateY(0deg) scale(1);
    }
  }

  @keyframes slideMorphPrev {
    0% {
      opacity: 0;
      transform: translateX(-70px) rotateY(8deg) scale(0.95);
    }
    100% {
      opacity: 1;
      transform: translateX(0) rotateY(0deg) scale(1);
    }
  }

  /* En-tête de slide */
  .slide-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1.5px solid var(--border-subtle);
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .num-badge {
    background: var(--gold);
    color: var(--dark-ink);
    font-weight: 900;
    font-size: 16px;
    padding: 8px 14px;
    border-radius: 12px;
    letter-spacing: 0.5px;
    box-shadow: 0 6px 14px rgba(212, 175, 55, 0.3);
  }
  .slide-kicker {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--bg-teal);
  }
  .slide-title {
    font-size: 28px;
    font-weight: 800;
    color: var(--dark-ink);
    line-height: 1.15;
  }
  .dark-icon-circle {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--dark-ink);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .slide-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }
  .slide-body::-webkit-scrollbar { width: 6px; }
  .slide-body::-webkit-scrollbar-thumb { background: #CBDCE2; border-radius: 10px; }

  /* Grilles & Cartes internes */
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

  .panel {
    background: var(--soft-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 18px;
    padding: 20px;
  }
  .panel.dark-panel {
    background: var(--dark-ink);
    color: #fff;
    border: none;
  }
  .panel.gold-panel {
    background: var(--gold-light);
    border: 1px solid rgba(212, 175, 55, 0.45);
  }
  .panel h3 {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 8px;
    color: var(--dark-ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel.dark-panel h3 { color: var(--gold); }
  .panel p, .panel li {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-body);
  }
  .panel.dark-panel p { color: #E2EEF2; }
  .panel ul { padding-left: 18px; }

  /* SLIDE 0 : COUVERTURE & SOMMAIRE */
  .cover-layout {
    display: grid;
    grid-template-columns: 1.05fr 1.25fr;
    gap: 28px;
    height: 100%;
    align-items: center;
  }
  .hero-box {
    background: var(--dark-ink);
    color: #fff;
    border-radius: 22px;
    padding: 32px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .hero-box::after {
    content: "";
    position: absolute;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: var(--accent-grad);
    opacity: 0.22;
    bottom: -70px;
    right: -70px;
  }
  .hero-tag {
    display: inline-block;
    background: rgba(212, 175, 55, 0.2);
    color: var(--gold);
    border: 1px solid rgba(212, 175, 55, 0.45);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .hero-title {
    font-size: 32px;
    font-weight: 900;
    line-height: 1.18;
    margin-bottom: 14px;
  }
  .hero-sub {
    font-size: 15px;
    color: #B8D4DE;
    line-height: 1.55;
    margin-bottom: 20px;
  }
  .actor-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .actor-chip {
    background: rgba(255, 255, 255, 0.1);
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
  }
  .sommaire-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 11px;
  }
  .som-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--soft-surface);
    border: 1px solid var(--border-subtle);
    padding: 11px 14px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
  }
  .som-item:hover {
    transform: translateY(-2px);
    border-color: var(--bg-teal);
    background: #E8F4F8;
  }
  .som-num {
    background: var(--gold);
    color: var(--dark-ink);
    font-weight: 900;
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .som-label {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--dark-ink);
  }

  /* SLIDE 02 : RECHERCHE QUALITATIVE */
  .qa-item {
    background: #fff;
    border-radius: 12px;
    padding: 11px 13px;
    margin-top: 10px;
    border-left: 4px solid var(--bg-teal);
  }
  .qa-q {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--dark-ink);
    margin-bottom: 4px;
  }
  .qa-a {
    font-size: 13px;
    color: var(--text-body);
    font-style: italic;
  }

  /* SLIDE 03 : RECHERCHE QUANTITATIVE (%) */
  .stat-card {
    background: var(--soft-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 18px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .stat-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .stat-pct {
    font-size: 38px;
    font-weight: 900;
    background: var(--accent-grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-tag {
    font-size: 11px;
    font-weight: 800;
    background: var(--dark-ink);
    color: var(--gold);
    padding: 4px 9px;
    border-radius: 999px;
  }
  .stat-bar-bg {
    width: 100%;
    height: 12px;
    background: #DCE8ED;
    border-radius: 999px;
    overflow: hidden;
    margin: 10px 0;
  }
  .stat-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--accent-grad);
    border-radius: 999px;
    transition: width 1.1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .stat-desc {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--dark-ink);
  }
  .stat-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* SLIDE 04 : PERSONA */
  .persona-layout {
    display: grid;
    grid-template-columns: 290px 1fr;
    gap: 22px;
    height: 100%;
  }
  .persona-left {
    background: var(--dark-ink);
    color: #fff;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .persona-avatar {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    overflow: hidden;
    background: #1C424F;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    position: relative;
  }
  .persona-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: relative;
    z-index: 2;
  }
  .persona-name { font-size: 20px; font-weight: 800; color: #fff; }
  .persona-role { font-size: 13px; color: var(--gold); font-weight: 700; margin: 4px 0 12px; }
  .persona-quote {
    background: rgba(255, 255, 255, 0.09);
    padding: 12px;
    border-radius: 12px;
    font-size: 12.5px;
    font-style: italic;
    color: #DCEEF4;
    line-height: 1.45;
  }
  .persona-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border-subtle);
  }
  .p-tag {
    background: var(--dark-ink);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 13px;
    border-radius: 999px;
  }
  .p-tag.gold { background: var(--gold); color: var(--dark-ink); }

  /* SLIDE 05 : OBJECTIFS & SOLUTIONS */
  .obj-row {
    display: grid;
    grid-template-columns: 1fr 48px 1fr;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .arrow-circle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--dark-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    margin: 0 auto;
  }

  /* SLIDE 07 : CARTE D'EXPÉRIENCE */
  .exp-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .exp-col {
    background: var(--soft-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .exp-step {
    font-size: 11px;
    font-weight: 900;
    color: var(--bg-teal);
    text-transform: uppercase;
  }
  .exp-emoji {
    font-size: 26px;
    margin: 8px 0;
    text-align: center;
  }
  .emotion-svg {
    width: 100%;
    height: 76px;
    background: #fff;
    border-radius: 14px;
    border: 1px solid var(--border-subtle);
    margin: 12px 0;
    padding: 6px;
  }

  /* SLIDE 09 : USER FLOW */
  .flow-legend {
    display: flex;
    gap: 18px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .leg-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
  .shape-circle { width: 16px; height: 16px; border-radius: 50%; background: var(--flow-action); }
  .shape-rect { width: 20px; height: 14px; border-radius: 4px; background: var(--flow-screen); }
  .shape-diamond { width: 14px; height: 14px; background: var(--flow-decision); transform: rotate(45deg); }

  .flow-canvas {
    background: #F8FBFC;
    border: 2px dashed #BFD6DF;
    border-radius: 18px;
    padding: 16px;
    position: relative;
  }
  .flow-track {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .node-action {
    background: #DDF7EE;
    border: 2px solid var(--flow-action);
    color: #0E4D38;
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
  }
  .node-screen {
    background: #FEF6D8;
    border: 2px solid var(--flow-screen);
    color: #5C4500;
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
  }
  .node-decision {
    background: #E0F3F8;
    border: 2px solid var(--flow-decision);
    color: #102A33;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    box-shadow: inset 0 0 0 2px #fff;
  }
  .f-arrow { color: var(--text-muted); font-weight: 900; }

  /* SLIDE 10 : PROTOTYPE & WIREFRAMES */
  .proto-wrapper {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 24px;
    height: 100%;
    align-items: center;
  }
  .screen-selector {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .scr-btn {
    background: var(--soft-surface);
    border: 1.5px solid var(--border-subtle);
    padding: 12px 14px;
    border-radius: 14px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .scr-btn.active {
    background: var(--dark-ink);
    color: #fff;
    border-color: var(--dark-ink);
  }
  .scr-btn small { display: block; font-size: 11px; opacity: 0.75; }
  .scr-btn strong { font-size: 13.5px; }

  .proto-stage {
    display: grid;
    grid-template-columns: 270px 1fr;
    gap: 24px;
    align-items: center;
    background: var(--soft-surface);
    border-radius: 20px;
    padding: 20px 26px;
    border: 1px solid var(--border-subtle);
  }
  .phone-frame {
    width: 255px;
    height: 445px;
    background: #fff;
    border: 3px solid var(--dark-ink);
    border-radius: 28px;
    padding: 14px;
    box-shadow: 0 14px 30px rgba(16, 42, 51, 0.16);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .phone-frame img.real-screen {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 5;
    background: #fff;
  }
  .wf-box-x {
    border: 1.5px solid #8A9BA3;
    background: #F1F5F7;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wf-box-x::before, .wf-box-x::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 1px;
    background: #9FB0B8;
  }
  .wf-box-x::before { transform: rotate(28deg); }
  .wf-box-x::after { transform: rotate(-28deg); }

  /* Barre inférieure de navigation */
  .bottombar {
    position: relative;
    z-index: 10;
    height: 68px;
    padding: 0 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #fff;
  }
  .progress-track {
    flex: 1;
    max-width: 460px;
    height: 6px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.4s ease;
  }
  .nav-buttons {
    display: flex;
    gap: 12px;
  }
  .nav-btn {
    background: #fff;
    color: var(--dark-ink);
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(16, 42, 51, 0.22);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .nav-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }

  /* Modal Zoom Image HD */
  .zoom-modal {
    position: fixed;
    inset: 0;
    background: rgba(16, 42, 51, 0.88);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }
  .zoom-modal.open { display: flex; }
  .zoom-content {
    background: #fff;
    padding: 20px;
    border-radius: 20px;
    max-width: 92vw;
    max-height: 90vh;
    overflow: auto;
    position: relative;
  }
  .close-zoom {
    position: sticky;
    top: 0;
    float: right;
    background: var(--dark-ink);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 999px;
    font-weight: 800;
    cursor: pointer;
  }

  @media (max-width: 960px) {
    .cover-layout, .persona-layout, .proto-wrapper, .proto-stage, .grid-2, .grid-3, .grid-4, .exp-grid {
      grid-template-columns: 1fr;
    }
    .slide-card { padding: 22px; }
  }
</style>
</head>
<body>

<div class="ambient-bg"></div>

<!-- Barre supérieure -->
<header class="topbar">
  <div class="brand-pill">
    <span class="brand-dot"></span>
    <span>CMC RABAT · ÉTUDE UX DESIGN — LIVRAISON CAMPUS</span>
  </div>
  <div class="top-actions">
    <span class="slide-counter" id="slideCounter">00 / 10</span>
    <button class="top-btn gold-btn" onclick="goToSlide(0)">Sommaire</button>
    <button class="top-btn" onclick="toggleFullscreen()">Plein écran</button>
  </div>
</header>

<!-- Scène principale -->
<main class="viewport">
  <section class="slide-card" id="slideCard"></section>
</main>

<!-- Barre inférieure -->
<footer class="bottombar">
  <div style="font-size:12.5px;opacity:.9;font-weight:600">Navigation : Flèches ← → ou boutons</div>

let currentSlide = 0;

function renderSlide(direction = "next") {
  const card = document.getElementById("slideCard");
  const slide = SLIDES[currentSlide];

  card.classList.remove("prev-anim");
  void card.offsetWidth;
  if (direction === "prev") card.classList.add("prev-anim");

  if (slide.isCover) {
    card.innerHTML = slide.render();
  } else {
    card.innerHTML = `
      <div class="slide-header">
        <div class="header-left">
          <span class="num-badge">${slide.num}</span>
          <div>
            <div class="slide-kicker">${slide.kicker}</div>
            <h2 class="slide-title">${slide.title}</h2>
          </div>
        </div>
        <div class="dark-icon-circle">${slide.icon}</div>
      </div>
      <div class="slide-body">${slide.render()}</div>
    `;
  }

  document.getElementById("slideCounter").textContent = `${String(currentSlide).padStart(2, "0")} / 10`;
  document.getElementById("progressFill").style.width = `${(currentSlide / (SLIDES.length - 1)) * 100}%`;
  document.getElementById("prevBtn").disabled = currentSlide === 0;
  document.getElementById("nextBtn").disabled = currentSlide === SLIDES.length - 1;

  if (typeof slide.onEnter === "function") slide.onEnter();
}

function selectProtoScreen(idx) {
  PROTO_SCREENS.forEach((_, i) => {
    const btn = document.getElementById(`scrBtn_${i}`);
    if (btn) btn.classList.toggle("active", i === idx);
  });
  const scr = PROTO_SCREENS[idx];
  const stage = document.getElementById("protoStage");
  if (!stage) return;
  stage.innerHTML = `
    <div class="phone-frame" title="Cliquez pour zoomer" style="cursor:zoom-in" onclick="zoomPhoneScreen(${idx})">
      <img class="real-screen" src="${scr.img}" alt="${scr.name}" onerror="this.style.display='none'">
      ${scr.wireframeHTML}
    </div>
    <div>
      <span class="num-badge" style="font-size:12px;padding:5px 10px">${scr.step}</span>
      <h3 style="font-size:22px;font-weight:900;margin:10px 0 8px;color:var(--dark-ink)">${scr.name}</h3>
      <p style="font-size:14.5px;color:var(--text-body);line-height:1.55;margin-bottom:14px">${scr.desc}</p>

    </div>
  `;
}

  body.innerHTML = `
    <button class="close-zoom" onclick="closeZoom()">Fermer ✕</button>
    <h3 style="margin-bottom:14px;color:var(--dark-ink)">${scr.step} — ${scr.name}</h3>
    <div style="display:flex;justify-content:center;padding:10px">
      <div class="phone-frame" style="width:320px;height:550px;transform:scale(1.02)">
        <img class="real-screen" src="${scr.img}" alt="${scr.name}" onerror="this.style.display='none'">
        ${scr.wireframeHTML}
      </div>
    </div>`;
  document.getElementById("zoomModal").classList.add("open");
}

function openFlowZoom() {
  const box = document.getElementById("flowDiagramBox").innerHTML;
  document.getElementById("zoomBody").innerHTML = `
    <button class="close-zoom" onclick="closeZoom()">Fermer ✕</button>
    <h3 style="margin-bottom:14px;color:var(--dark-ink)">User Flow Complet — Application Livraison CMC Rabat</h3>
    <div style="min-width:860px;padding:10px">${box}</div>`;
  document.getElementById("zoomModal").classList.add("open");
}

function closeZoom() {
  document.getElementById("zoomModal").classList.remove("open");
}

function nextSlide() {
  if (currentSlide < SLIDES.length - 1) {
    currentSlide++;
    renderSlide("next");
  }
}

function prevSlide() {
  if (currentSlide > 0) {
    currentSlide--;
    renderSlide("prev");
  }
}

function goToSlide(index) {
  const dir = index >= currentSlide ? "next" : "prev";
  currentSlide = index;
  renderSlide(dir);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); nextSlide(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); prevSlide(); }
  else if (e.key === "Escape") closeZoom();
  else if (e.key === "f" || e.key === "F") toggleFullscreen();
});

renderSlide("next");
</script>
</body>
</html>
