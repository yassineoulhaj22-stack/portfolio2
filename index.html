<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMC Delivery — Conception UX & Wireframes (CMC Rabat)</title>
<style>
  :root {
    --teal-bg: #3A9AB2;
    --teal-deep: #246E82;
    --teal-light: #57B4CB;
    --card-white: #FFFFFF;
    --ink-dark: #102A33;
    --ink-body: #2E4750;
    --ink-muted: #5F7A84;
    --gold: #D4AF37;
    --gold-soft: #FBF5E2;
    --surface: #F2F7F9;
    --border-soft: #DCE8ED;
    --action-green: #24A173;
    --screen-yellow: #F2C12E;
    --decision-blue: #2B8CBE;
    --danger-rose: #D94E5A;
    --radius-card: 24px;
    --shadow-main: 0 24px 60px rgba(16, 42, 51, 0.28);
    --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 18% 18%, var(--teal-light) 0%, var(--teal-bg) 58%, var(--teal-deep) 100%);
    color: var(--ink-dark);
    user-select: none;
  }

  /* Fond animé avec formes organiques flottantes */
  .bg-blobs {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 44% 56% 62% 38% / 41% 45% 55% 59%;
    background: rgba(255, 255, 255, 0.08);
    animation: floatBlob 14s ease-in-out infinite alternate;
  }
  .blob-1 {
    width: 460px;
    height: 460px;
    top: -120px;
    right: -90px;
    animation-duration: 16s;
  }
  .blob-2 {
    width: 360px;
    height: 360px;
    bottom: -100px;
    left: -80px;
    animation-duration: 13s;
    animation-delay: -3s;
  }
  .blob-3 {
    width: 240px;
    height: 240px;
    top: 38%;
    left: 48%;
    background: rgba(212, 175, 55, 0.08);
    animation-duration: 18s;
    animation-delay: -6s;
  }

  @keyframes floatBlob {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      border-radius: 44% 56% 62% 38% / 41% 45% 55% 59%;
    }
    50% {
      transform: translate3d(28px, -24px, 0) rotate(12deg) scale(1.05);
      border-radius: 58% 42% 39% 61% / 54% 37% 63% 46%;
    }
    100% {
      transform: translate3d(-20px, 22px, 0) rotate(-10deg) scale(0.97);
      border-radius: 48% 52% 55% 45% / 42% 58% 42% 58%;
    }
  }

  /* Barre de progression tout en haut */
  .top-progress-wrap {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: rgba(16, 42, 51, 0.25);
    z-index: 30;
  }
  .top-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), #FFE07D);
    transition: width 0.55s var(--ease-smooth);
  }

  /* Barre supérieure de contrôles */
  .topbar {
    position: relative;
    z-index: 20;
    height: 62px;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #fff;
    gap: 12px;
  }
  .brand-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(16, 42, 51, 0.28);
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.4px;
    backdrop-filter: blur(6px);
  }
  .pulse-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--gold);
    animation: pulseGlow 2.2s infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.65; }
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .slide-pill {
    background: rgba(255, 255, 255, 0.16);
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 800;
  }
  .ctrl-btn {
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.36);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.22s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .ctrl-btn:hover {
    background: #fff;
    color: var(--ink-dark);
    transform: translateY(-1px);
  }
  .ctrl-btn.sommaire-btn {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--ink-dark);
    font-weight: 800;
  }
  .ctrl-btn.sommaire-btn:hover {
    background: #F4CE4E;
  }

  /* Scène principale */
  .stage-wrap {
    position: relative;
    z-index: 10;
    height: calc(100vh - 128px);
    padding: 4px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1700px;
  }

  .slide-card {
    width: 100%;
    max-width: 1280px;
    height: 100%;
    max-height: 705px;
    background: var(--card-white);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-main);
    padding: 28px 38px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform-style: preserve-3d;
  }

  .slide-card.anim-next {
    animation: morphNext 0.68s var(--ease-smooth) forwards;
  }
  .slide-card.anim-prev {
    animation: morphPrev 0.68s var(--ease-smooth) forwards;
  }
  .slide-card.anim-replay {
    animation: replayPop 0.55s var(--ease-smooth) forwards;
  }

  @keyframes morphNext {
    0% {
      opacity: 0;
      transform: translate3d(75px, 12px, -80px) rotateY(-8deg) scale(0.95);
    }
    100% {
      opacity: 1;
      transform: translate3d(0, 0, 0) rotateY(0deg) scale(1);
    }
  }
  @keyframes morphPrev {
    0% {
      opacity: 0;
      transform: translate3d(-75px, 12px, -80px) rotateY(8deg) scale(0.95);
    }
    100% {
      opacity: 1;
      transform: translate3d(0, 0, 0) rotateY(0deg) scale(1);
    }
  }
  @keyframes replayPop {
    0% { transform: scale(0.985); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Cascade d'apparition des éléments internes */
  .stagger-item {
    opacity: 0;
    transform: translateY(16px);
    animation: cascadeUp 0.55s var(--ease-smooth) forwards;
  }
  @keyframes cascadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* En-tête de slide */
  .slide-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 1.5px solid var(--border-soft);
    flex-shrink: 0;
  }
  .slide-head-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .gold-num {
    background: var(--gold);
    color: var(--ink-dark);
    font-weight: 900;
    font-size: 16px;
    padding: 7px 13px;
    border-radius: 12px;
    box-shadow: 0 6px 14px rgba(212, 175, 55, 0.3);
  }
  .slide-kicker {
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.15px;
    color: var(--teal-bg);
  }
  .slide-title {
    font-size: 26px;
    font-weight: 900;
    color: var(--ink-dark);
    line-height: 1.15;
  }
  .dark-badge-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--ink-dark);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .slide-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }
  .slide-body::-webkit-scrollbar { width: 6px; }
  .slide-body::-webkit-scrollbar-thumb { background: #C8D9E0; border-radius: 10px; }

  /* Grilles & Blocs */
  .g2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

  .box {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 16px;
  }
  .box-dark {
    background: var(--ink-dark);
    color: #fff;
    border: none;
  }
  .box-gold {
    background: var(--gold-soft);
    border: 1px solid rgba(212, 175, 55, 0.5);
  }
  .box h3 {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink-dark);
    margin-bottom: 6px;
  }
  .box-dark h3 { color: var(--gold); }
  .box p, .box li {
    font-size: 13.5px;
    line-height: 1.48;
    color: var(--ink-body);
  }
  .box-dark p, .box-dark li { color: #E3EFF3; }
  .box ul { padding-left: 16px; }

  /* SLIDE 0 : SOMMAIRE */
  .som-layout {
    display: grid;
    grid-template-columns: 1fr 1.45fr;
    gap: 24px;
    height: 100%;
    align-items: center;
  }
  .som-hero {
    background: var(--ink-dark);
    color: #fff;
    border-radius: 20px;
    padding: 26px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .som-hero::after {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal-bg), var(--gold));
    opacity: 0.18;
    bottom: -60px;
    right: -60px;
  }
  .som-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .som-card {
    display: flex;
    align-items: center;
    gap: 11px;
    background: var(--surface);
    border: 1.5px solid var(--border-soft);
    border-radius: 14px;
    padding: 10px 13px;
    cursor: pointer;
    text-align: left;
    transition: all 0.22s var(--ease-smooth);
  }
  .som-card:hover {
    transform: translateY(-2px) scale(1.01);
    border-color: var(--teal-bg);
    background: #E7F4F8;
  }
  .som-card-num {
    background: var(--gold);
    color: var(--ink-dark);
    font-weight: 900;
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .som-card-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--ink-dark);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .som-card-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--ink-dark);
  }

  /* SLIDE 02 : QUALITATIF */
  .qa-box {
    background: #fff;
    border-radius: 10px;
    padding: 9px 11px;
    margin-top: 8px;
    border-left: 3.5px solid var(--teal-bg);
  }
  .qa-q { font-size: 12px; font-weight: 800; color: var(--ink-dark); margin-bottom: 3px; }
  .qa-a { font-size: 12.5px; color: var(--ink-body); font-style: italic; }

  /* SLIDE 03 : QUANTITATIF (%) */
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .kpi-top { display: flex; justify-content: space-between; align-items: baseline; }
  .kpi-num {
    font-size: 36px;
    font-weight: 900;
    color: var(--teal-deep);
  }
  .kpi-badge {
    background: var(--ink-dark);
    color: var(--gold);
    font-size: 11px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .kpi-bar-track {
    width: 100%;
    height: 11px;
    background: #DCE8ED;
    border-radius: 999px;
    overflow: hidden;
    margin: 9px 0;
  }
  .kpi-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--teal-bg), var(--action-green));
    border-radius: 999px;
    transition: width 1.15s var(--ease-smooth);
  }

  /* SLIDE 04 : PERSONA & EMPATHY MAP */
  .view-switch {
    display: inline-flex;
    background: var(--surface);
    padding: 4px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    gap: 4px;
  }
  .view-tab {
    border: none;
    background: transparent;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-body);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .view-tab.active {
    background: var(--ink-dark);
    color: var(--gold);
  }

  .persona-grid {
    display: grid;
    grid-template-columns: 270px 1fr;
    gap: 18px;
  }
  .persona-card-left {
    background: var(--ink-dark);
    color: #fff;
    border-radius: 18px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .avatar-ring {
    width: 98px;
    height: 98px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    overflow: hidden;
    background: #1B4350;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    position: relative;
  }
  .avatar-ring img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: relative;
    z-index: 2;
  }

  /* Carte d'Empathie Radiale SVG + 6 capsules */
  .empathy-stage {
    position: relative;
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 10px;
    align-items: center;
    min-height: 430px;
  }
  .empathy-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    z-index: 3;
  }
  .empathy-capsules-wrap {
    position: relative;
    height: 430px;
  }
  .empathy-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  .dash-arrow {
    stroke-dasharray: 8 6;
    stroke-dashoffset: 180;
    transition: stroke-dashoffset 1.2s var(--ease-smooth);
  }
  .dash-arrow.drawn {
    stroke-dashoffset: 0;
  }
  .emp-capsule {
    position: absolute;
    width: 46%;
    background: #fff;
    border-radius: 14px;
    padding: 10px 13px;
    border: 2px solid var(--border-soft);
    box-shadow: 0 8px 18px rgba(16, 42, 51, 0.08);
    z-index: 2;
    opacity: 0;
    transform: scale(0.9);
    transition: all 0.5s var(--ease-smooth);
  }
  .emp-capsule.show {
    opacity: 1;
    transform: scale(1);
  }
  .emp-capsule h4 {
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .emp-capsule p {
    font-size: 11.5px;
    line-height: 1.35;
    color: var(--ink-body);
  }
  .cap-dit { top: 8px; left: 4%; border-color: var(--teal-bg); }
  .cap-dit h4 { color: var(--teal-deep); }
  .cap-pense { top: 8px; right: 2%; border-color: var(--decision-blue); }
  .cap-pense h4 { color: var(--decision-blue); }
  .cap-voit { top: 155px; left: 4%; border-color: var(--gold); }
  .cap-voit h4 { color: #8A6D14; }
  .cap-ressent { top: 155px; right: 2%; border-color: var(--action-green); }
  .cap-ressent h4 { color: #167A55; }
  .cap-pains { bottom: 8px; left: 4%; border-color: var(--danger-rose); background: #FFF5F6; }
  .cap-pains h4 { color: var(--danger-rose); }
  .cap-gains { bottom: 8px; right: 2%; border-color: var(--action-green); background: #F1FBF7; }
  .cap-gains h4 { color: #167A55; }

  /* SLIDE 07 : CARTE D'EXPÉRIENCE (CHEVRONS + COURBE MIXTE) */
  .chevron-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 8px 0 10px;
  }
  .chevron-step {
    background: var(--ink-dark);
    color: #fff;
    padding: 8px 14px;
    clip-path: polygon(0% 0%, 92% 0%, 100% 50%, 92% 100%, 0% 100%, 7% 50%);
    font-size: 12.5px;
    font-weight: 800;
    text-align: center;
  }
  .chevron-step.gold-chev {
    background: var(--gold);
    color: var(--ink-dark);
  }
  .exp-matrix-line {
    display: grid;
    grid-template-columns: 118px repeat(4, 1fr);
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row-label-box {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 8px;
    font-size: 12px;
    font-weight: 900;
    color: var(--ink-dark);
    text-align: center;
  }
  .cell-mini {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 11.5px;
    line-height: 1.35;
    color: var(--ink-body);
  }
  .trace-path {
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    transition: stroke-dashoffset 1.5s var(--ease-smooth);
  }
  .trace-path.drawn {
    stroke-dashoffset: 0;
  }

  /* SLIDE 08 : PARCOURS UTILISATEUR (5 CHEVRONS + ÉMOJIS + COURBE) */
  .journey-meta-bar {
    display: flex;
    justify-content: space-between;
    background: var(--ink-dark);
    color: #fff;
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .journey-meta-bar span b { color: var(--gold); }
  .chev5 {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .j-grid-row {
    display: grid;
    grid-template-columns: 140px repeat(5, 1fr);
    gap: 6px;
    align-items: center;
    margin-bottom: 7px;
  }
  .j-left-label {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 8px;
    font-size: 11.5px;
    font-weight: 900;
    color: var(--ink-dark);
    text-align: center;
  }
  .mood-row {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 6px;
    align-items: center;
    margin-bottom: 7px;
  }
  .mood-faces {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 76px;
    font-size: 17px;
    padding-left: 6px;
  }

  /* SLIDE 09 : USER FLOW */
  .flow-legend {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .leg-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 800;
  }
  .dot-green { width: 16px; height: 16px; border-radius: 50%; background: var(--action-green); display: inline-block; }
  .rect-yellow { width: 22px; height: 14px; border-radius: 4px; background: var(--screen-yellow); border: 1.5px solid #B58900; display: inline-block; }
  .diamond-blue { width: 14px; height: 14px; background: var(--decision-blue); transform: rotate(45deg); display: inline-block; }

  .flow-box-area {
    background: #F8FBFD;
    border: 2px dashed #BFD6DF;
    border-radius: 16px;
    padding: 14px;
  }
  .flow-line {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 11px;
  }
  .f-circle {
    background: #E2F7EF;
    border: 2px solid var(--action-green);
    color: #0B4D35;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 800;
  }
  .f-rect {
    background: #FFF6D6;
    border: 2px solid var(--screen-yellow);
    color: #594200;
    padding: 6px 11px;
    border-radius: 7px;
    font-size: 11.5px;
    font-weight: 800;
  }
  .f-diamond {
    background: #E1F2FA;
    border: 2px solid var(--decision-blue);
    color: #0C3B54;
    padding: 6px 11px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 800;
    outline: 2px solid #fff;
  }
  .f-arr { font-weight: 900; color: var(--ink-muted); font-size: 13px; }

  /* SLIDE 10 : WIREFRAMES LOW-FI */
  .wf-container {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 20px;
    align-items: center;
  }
  .wf-menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .wf-tab-btn {

          <span class="f-arr">→</span>
          <span class="f-rect">Suivi en direct</span>
          <span class="f-arr">→</span>
          <span class="f-circle">Scanner QR Code</span>
          <span class="f-arr">→</span>
          <span class="f-rect">Réception confirmée</span>
        </div>
      </div>`
  },

  /* SLIDE 10 : WIREFRAMES (MAQUETTES FILAIRES LOW-FI — SANS UI) */
  {
    num: "10",
    kicker: "Basse fidélité (Low-Fi) · 5 écrans clés",
    title: "Wireframes",
    icon: SVG_ICONS.wireframe,
    onEnter: () => selectWireframe(0),
    render: () => `
      <div class="wf-container">
        <div class="wf-menu stagger-item">
          ${WIREFRAMES.map((wf, idx) => `
            <button class="wf-tab-btn ${idx === 0 ? "active" : ""}" id="wfTab_${idx}" onclick="selectWireframe(${idx})">
              <small>${wf.tag}</small>
              <strong>${wf.title}</strong>
            </button>
          `).join("")}
        </div>
        <div class="wf-display stagger-item" style="animation-delay:0.08s" id="wfDisplayArea"></div>
      </div>`
  }
];

let currentIdx = 0;
window._empathyActive = false;
let empathyViewMode = "persona";

function selectWireframe(idx) {
  WIREFRAMES.forEach((_, i) => {
    const btn = document.getElementById("wfTab_" + i);
    if (btn) btn.classList.toggle("active", i === idx);
  });
  const wf = WIREFRAMES[idx];
  const area = document.getElementById("wfDisplayArea");
  if (!area) return;
  area.innerHTML = `
    <div class="lofi-phone">${wf.screenHtml}</div>
    <div>
      <span class="gold-num" style="font-size:11.5px;padding:4px 10px">${wf.tag} · Low-Fidelity UX</span>
      <h3 style="font-size:20px;font-weight:900;margin:8px 0 6px;color:var(--ink-dark)">${wf.title}</h3>
      <p style="font-size:13.5px;color:var(--ink-body);line-height:1.45;margin-bottom:12px">${wf.summary}</p>
      <div class="box" style="background:#fff">
        <h3>Annotations UX (Ergonomie & Structure)</h3>
        <ul>${wf.notes.map(n => `<li>${n}</li>`).join("")}</ul>
      </div>
    </div>
  `;
}

function switchPersonaView(mode) {
  empathyViewMode = mode;
  const tabP = document.getElementById("tabPersona");
  const tabE = document.getElementById("tabEmpathy");
  const box = document.getElementById("personaViewContainer");
  if (!box) return;

  if (tabP) tabP.classList.toggle("active", mode === "persona");
  if (tabE) tabE.classList.toggle("active", mode === "empathy");

  if (mode === "persona") {
    window._empathyActive = false;
    box.innerHTML = `
      <div class="persona-grid">
        <div class="persona-card-left">
          <div class="avatar-ring">
            <img src="persona.png" alt="Yassine El Amrani" onerror="this.style.display='none'">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </div>
          <div style="font-size:18px;font-weight:900">Yassine El Amrani</div>
          <div style="font-size:12px;color:var(--gold);font-weight:700;margin:3px 0 10px">20 ans · Stagiaire en Digital Design à la CMC Rabat</div>
          <p style="font-size:11.5px;color:#C2DCE6;line-height:1.45">
            Stagiaire à la CMC Rabat (Tamesna), il suit des modules pratiques et gère son budget étudiant au quotidien.
          </p>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="box box-dark" style="padding:11px 15px">
            <h3>Problématique personnelle du Persona</h3>
            <p style="font-size:12.5px">Lors de sa pause de 30 à 45 minutes, Yassine n'a pas le temps de marcher loin ni d'attendre en file, et il veut éviter les frais de livraison trop élevés pour un budget de 25 DH.</p>
          </div>
          <div class="g2">
            <div class="box" style="padding:12px 14px">
              <h3>Bio & Objectifs clés</h3>
              <p style="font-size:12px"><b>Bio :</b> Utilise son smartphone entre les séances pour s'organiser avec ses camarades.<br><b>Objectifs :</b> Manger à l'heure, respecter son budget (20–30 DH) et ne pas rater la reprise.</p>
            </div>
            <div class="box box-gold" style="padding:12px 14px">
              <h3>Frustrations & Attentes</h3>
              <p style="font-size:12px"><b>Frustrations :</b> Files d'attente, frais élevés, retards.<br><b>Attentes :</b> Précommande à 12h30, panier groupé, suivi direct et retrait QR Code.</p>
            </div>
          </div>
        </div>
      </div>`;
  } else {
    window._empathyActive = true;
    box.innerHTML = `
      <div class="empathy-stage">
        <div class="empathy-center">
          <div class="avatar-ring" style="width:86px;height:86px">
            <img src="persona.png" alt="Yassine El Amrani" onerror="this.style.display='none'">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </div>
          <div style="font-size:13.5px;font-weight:900">Yassine El Amrani</div>
          <div style="font-size:11px;color:var(--ink-muted);font-weight:700">Stagiaire CMC Rabat</div>
        </div>

        <div class="empathy-capsules-wrap">
          <svg class="empathy-svg" viewBox="0 0 760 430" preserveAspectRatio="none">
            <defs>
              <marker id="arrTeal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#246E82"/>
              </marker>
            </defs>
            <path id="ea1" class="dash-arrow" d="M 10 175 Q 110 70, 175 55" fill="none" stroke="#246E82" stroke-width="2.2" marker-end="url(#arrTeal)"/>
            <path id="ea2" class="dash-arrow" d="M 10 175 Q 250 40, 405 55" fill="none" stroke="#2B8CBE" stroke-width="2.2" marker-end="url(#arrTeal)"/>
            <path id="ea3" class="dash-arrow" d="M 10 190 L 175 190" fill="none" stroke="#D4AF37" stroke-width="2.2" marker-end="url(#arrTeal)"/>
            <path id="ea4" class="dash-arrow" d="M 10 190 Q 220 190, 405 190" fill="none" stroke="#24A173" stroke-width="2.2" marker-end="url(#arrTeal)"/>
            <path id="ea5" class="dash-arrow" d="M 10 205 Q 110 340, 175 365" fill="none" stroke="#D94E5A" stroke-width="2.2" marker-end="url(#arrTeal)"/>
            <path id="ea6" class="dash-arrow" d="M 10 205 Q 250 360, 405 365" fill="none" stroke="#24A173" stroke-width="2.2" marker-end="url(#arrTeal)"/>
          </svg>

          <div class="emp-capsule cap-dit" id="ec1"><h4>Ce qu'il dit</h4><p>« On n'a que 30 à 45 min de pause, il faut commander vite et à petit prix. »</p></div>
          <div class="emp-capsule cap-pense" id="ec2"><h4>Ce qu'il pense</h4><p>« Si je commande avec mes camarades, on paiera moins de livraison. »</p></div>
          <div class="emp-capsule cap-voit" id="ec3"><h4>Ce qu'il voit</h4><p>Des files d'attente à midi et des camarades qui mangent sur le pouce.</p></div>
          <div class="emp-capsule cap-ressent" id="ec4"><h4>Ce qu'il ressent</h4><p>Stress du timing à 12h15, mais soulagement quand tout arrive à l'heure.</p></div>
          <div class="emp-capsule cap-pains" id="ec5"><h4>Pains</h4><p>Attente longue, frais élevés en solo, hésitation sur l'heure de remise.</p></div>
          <div class="emp-capsule cap-gains" id="ec6"><h4>Gains</h4><p>Précommande horodatée, panier partagé et retrait QR à la porte CMC.</p></div>
        </div>
      </div>`;
    runEmpathyAnimation();
  }
}

function runEmpathyAnimation() {
  for (let i = 1; i <= 6; i++) {
    const arrow = document.getElementById("ea" + i);
    const cap = document.getElementById("ec" + i);
    if (arrow) arrow.classList.remove("drawn");
    if (cap) cap.classList.remove("show");
    setTimeout(() => {
      if (arrow) arrow.classList.add("drawn");
      if (cap) cap.classList.add("show");
    }, i * 140);
  }
}

function renderSlide(animType = "anim-next") {
  const card = document.getElementById("slideCard");
  const slide = SLIDES[currentIdx];

  card.classList.remove("anim-next", "anim-prev", "anim-replay");
  void card.offsetWidth;
  card.classList.add(animType);

  if (slide.isSommaire) {
    card.innerHTML = slide.render();
  } else {
    card.innerHTML = `
      <div class="slide-head">
        <div class="slide-head-left">
          <span class="gold-num">${slide.num}</span>
          <div>
            <div class="slide-kicker">${slide.kicker}</div>
            <h2 class="slide-title">${slide.title}</h2>
          </div>
        </div>
        <div class="dark-badge-icon">${slide.icon}</div>
      </div>
      <div class="slide-body">${slide.render()}</div>
    `;
  }

  document.getElementById("slideIndicator").textContent = `Slide ${currentIdx} / 10`;
  document.getElementById("topProgressBar").style.width = `${(currentIdx / (SLIDES.length - 1)) * 100}%`;
  document.getElementById("prevBtn").disabled = currentIdx === 0;
  document.getElementById("nextBtn").disabled = currentIdx === SLIDES.length - 1;

  if (currentIdx === 4) {
    switchPersonaView(empathyViewMode);
  } else {
    window._empathyActive = false;
  }

  if (typeof slide.onEnter === "function") {
    slide.onEnter();
  }
}

function nextSlide() {
  if (currentIdx < SLIDES.length - 1) {
    currentIdx++;
    renderSlide("anim-next");
  }
}

function prevSlide() {
  if (currentIdx > 0) {
    currentIdx--;
    renderSlide("anim-prev");
  }
}

function goToSlide(idx) {
  const anim = idx >= currentIdx ? "anim-next" : "anim-prev";
  currentIdx = idx;
  renderSlide(anim);
}

function replayCurrentAnimation() {
  renderSlide("anim-replay");
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") {
    e.preventDefault();
    nextSlide();
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    prevSlide();
  } else if (e.key === "r" || e.key === "R") {
    replayCurrentAnimation();
  }
});

renderSlide("anim-next");
</script>
</body>
</html>
